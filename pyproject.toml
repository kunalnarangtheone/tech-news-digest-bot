[project]
name = "tech-digest-bot"
version = "0.4.0"
description = "AI-powered tech news research API with LangChain agent"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Kunal Narang" }]
keywords = ["ai", "web", "api", "tech-news", "langchain", "research", "fastapi", "nextjs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "groq>=1.0.0",
    "ddgs>=9.0.0",
    "aiohttp>=3.9.0",
    # LangChain dependencies
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    # LangGraph orchestration
    "langgraph>=0.2.0",
    # Web scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # Observability (optional)
    "langfuse>=2.0.0",
    # Core dependencies
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "dependency-injector>=4.41.0",
    "jinja2>=3.1.0",
    # FastAPI dependencies
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]

[project.scripts]
tech-digest-api = "tech_digest_bot.api.main:main"

[project.urls]
Repository = "https://github.com/yourusername/tech-digest-bot"
Documentation = "https://github.com/yourusername/tech-digest-bot/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_digest_bot"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ddgs", "openai.*", "groq.*", "langgraph.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
